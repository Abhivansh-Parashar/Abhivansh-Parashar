name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate leetcode.svg
        run: python3 scripts/update_leetcode.py
        env:
          LEETCODE_USERNAME: Abhivansh_Parashar

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/leetcode.svg; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/leetcode.svg
            git commit -m "chore: update LeetCode stats"
            git push
          fi
